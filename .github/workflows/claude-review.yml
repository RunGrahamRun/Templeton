name: Claude Twinstone Review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

jobs:
  claude-review:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      actions: read
      id-token: write

    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Claude assurance review
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          track_progress: true
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}
            BASE: ${{ github.base_ref }}
            HEAD: ${{ github.head_ref }}


            Act as the independent Twinstone assurance reviewer for this pull request.

            Mandatory process:
            1. Read AGENTS.md, then TWINSTONE_RULES.md, then CONTRACT.md before reviewing the implementation.
            2. Run `npm ci` and `npm test` against the checked-out PR branch.
            3. Inspect the full PR diff and relevant tests.
            4. Review both software correctness and Twinstone's architectural/epistemic boundaries.
            5. Identify any missing deterministic tests introduced by the change.

            Important boundaries include, but are not limited to:
            - observation != assessment
            - derived estimate != direct observation
            - context != corroborating evidence
            - missing/unavailable feed != zero activity
            - stale/last-known-good != current
            - FIRMS anomaly != attack/strike/damage/attribution
            - Sentinel/EO change != damage/cause/actor
            - UCDP report != physical sensor proof
            - GFW encounter != transshipment
            - GFW AIS gap != deliberate disabling or intent
            - cross-source association != causation
            - deterministic corroboration score != threat/targeting rating
            - LLM output must not alter deterministic results or create source evidence

            Also check provenance survival, stable identity, source-appropriate freshness,
            last-known-good behavior, credential/secret hygiene, version consistency,
            README/changelog/Mermaid discipline, and CORE/IES compatibility boundaries.

            Automatic-review restrictions:
            - REVIEW ONLY. Do not edit files, commit, push, merge, or approve this PR.
            - Do not weaken tests or rules to make a change pass.
            - If a rule intentionally changes, require an explicit architectural rationale and coordinated updates to rules, contract, tests, ontology/SHACL and documentation where applicable.

            Classify findings as BLOCKING, WARNING, or INFO.
            Any deterministic test failure or semantic-boundary violation is BLOCKING.
            Post a concise top-level PR summary, including the npm test result, and use inline comments for specific code findings where useful.

          claude_args: |
            --model sonnet
	    --allowedTools "Read,Glob,Grep,Bash(npm:*),Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr checks:*),mcp__github_inline_comment__create_inline_comment"
